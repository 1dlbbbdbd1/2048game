<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#bbada0">
    <meta name="description" content="经典数字合并游戏，支持多种棋盘大小">
    <title>2048</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="css/style.css?v=2.1.1">
</head>
<body>
    <!-- 主菜单 -->
    <section id="page-menu" class="page active">
        <div class="menu-card">
            <h1 class="game-title">2048</h1>
            <p class="game-subtitle">经典数字合并游戏</p>
            <div class="menu-buttons">
                <button id="btn-new-game" class="btn btn-primary">新游戏</button>
                <button id="btn-continue-game" class="btn btn-secondary" style="display: none;">继续游戏</button>
                <button id="btn-settings" class="btn btn-secondary">设置</button>
                <button id="btn-leaderboard" class="btn btn-secondary">排行榜</button>
            </div>
        </div>
    </section>

    <!-- 棋盘选择弹窗 -->
    <div class="modal-overlay hidden" id="modal-size">
        <div class="modal-card">
            <h2 class="modal-title">选择棋盘大小</h2>
            <div class="modal-size-grid" id="modal-size-grid">
                <button class="size-card" data-size="4">
                    <span class="size-card-num">4x4</span>
                    <span class="size-card-label">经典</span>
                </button>
                <button class="size-card" data-size="5">
                    <span class="size-card-num">5x5</span>
                    <span class="size-card-label">休闲</span>
                </button>
                <button class="size-card" data-size="6">
                    <span class="size-card-num">6x6</span>
                    <span class="size-card-label">宽敞</span>
                </button>
                <button class="size-card" data-size="7">
                    <span class="size-card-num">7x7</span>
                    <span class="size-card-label">广阔</span>
                </button>
                <button class="size-card" data-size="8">
                    <span class="size-card-num">8x8</span>
                    <span class="size-card-label">自由</span>
                </button>
            </div>
            <button class="btn btn-secondary modal-cancel" id="btn-modal-cancel">取消</button>
        </div>
    </div>

    <!-- 全局确认弹窗 -->
    <div class="modal-overlay hidden" id="modal-confirm">
        <div class="modal-card">
            <h2 class="modal-title" id="modal-confirm-title"></h2>
            <p class="modal-msg" id="modal-confirm-msg"></p>
            <div class="modal-confirm-buttons" id="modal-confirm-buttons"></div>
        </div>
    </div>

    <!-- 游戏页 -->
    <section id="page-game" class="page">
        <div class="game-container">
            <div class="game-topbar">
                <button id="btn-back-menu" class="btn-icon" title="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="score-box">
                    <span class="score-label">分数</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">最佳</span>
                    <span class="score-value" id="best-score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">时间</span>
                    <span class="score-value" id="timer">00:00</span>
                </div>
                <button id="btn-mute" class="btn-icon" title="音量">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
            </div>
            <div class="board-wrapper" id="board-wrapper">
                <div class="board" id="board"></div>
                <div class="tile-layer" id="tile-layer"></div>
                <div class="overlay hidden" id="overlay">
                    <div class="overlay-content">
                        <h2 id="overlay-title"></h2>
                        <p id="overlay-msg"></p>
                        <div class="overlay-buttons" id="overlay-buttons"></div>
                    </div>
                </div>
                <div class="overlay hidden" id="pause-overlay">
                    <div class="overlay-content">
                        <h2>⏸ 已暂停</h2>
                        <p>点击继续游戏</p>
                    </div>
                </div>
            </div>
            <!-- 返回提示 Toast -->
            <div class="toast" id="back-toast">再按一次退出游戏</div>
            <!-- 功能工具栏 -->
            <div class="action-bar" id="action-bar">
                <div class="action-btn-wrap">
                    <button id="btn-game-restart" class="btn-icon" title="新游戏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                    </button>
                    <span class="action-label">新游戏</span>
                </div>
                <div class="action-btn-wrap">
                    <button id="btn-undo" class="btn-icon" title="撤回" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                        <span class="btn-badge"></span>
                    </button>
                    <span class="action-label">撤回</span>
                </div>
                <div class="action-btn-wrap">
                    <button id="btn-smash" class="btn-icon" data-mode="smash" title="敲击消除" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 12l-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/>
                            <path d="M17.64 15L22 10.64"/>
                            <path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>
                        </svg>
                        <span class="btn-badge"></span>
                    </button>
                    <span class="action-label">敲击</span>
                </div>
                <div class="action-btn-wrap">
                    <button id="btn-swap" class="btn-icon" data-mode="swap" title="交换位置" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
                        </svg>
                        <span class="btn-badge"></span>
                    </button>
                    <span class="action-label">交换</span>
                </div>
                <div class="action-btn-wrap">
                    <button id="btn-clear" class="btn-icon" data-mode="clear" title="清除小数字" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                        </svg>
                        <span class="btn-badge"></span>
                    </button>
                    <span class="action-label">清除</span>
                </div>
                <div class="action-btn-wrap">
                    <button id="btn-double" class="btn-icon" data-mode="double" title="翻倍" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 21 21 15 15 9"/>
                            <polyline points="9 3 3 9 9 15"/>
                            <line x1="21" y1="3" x2="14" y2="10"/>
                            <line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                        <span class="btn-badge"></span>
                    </button>
                    <span class="action-label">翻倍</span>
                </div>
            </div>
            <!-- 功能提示栏 -->
            <div class="ability-hint" id="ability-hint"></div>
            <p class="game-hint">方向键 / WASD 移动 · 滑动屏幕也可</p>
        </div>
    </section>

    <!-- 设置页 -->
    <section id="page-settings" class="page">
        <div class="page-card">
            <div class="page-header">
                <button id="btn-back-settings" class="btn-icon" title="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2>设置</h2>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label class="setting-label">音量</label>
                    <div class="volume-control">
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70">
                        <span class="volume-value" id="volume-value">70%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">主题颜色</label>
                    <div class="theme-picker" id="theme-picker">
                        <button class="theme-swatch active" data-theme="classic" title="经典">
                            <span class="swatch-color" style="background:#bbada0"></span>
                            <span class="swatch-name">经典</span>
                        </button>
                        <button class="theme-swatch" data-theme="dark" title="暗夜">
                            <span class="swatch-color" style="background:#2d2d44"></span>
                            <span class="swatch-name">暗夜</span>
                        </button>
                        <button class="theme-swatch" data-theme="ocean" title="海洋">
                            <span class="swatch-color" style="background:#5b7fa5"></span>
                            <span class="swatch-name">海洋</span>
                        </button>
                        <button class="theme-swatch" data-theme="forest" title="森林">
                            <span class="swatch-color" style="background:#6b8e6b"></span>
                            <span class="swatch-name">森林</span>
                        </button>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">棋盘大小偏好</label>
                    <div class="toggle-row">
                        <span class="toggle-label">每次开始时询问</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-ask-size">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="size-picker" id="size-picker-default">
                        <button class="size-btn" data-size="4">4x4</button>
                        <button class="size-btn" data-size="5">5x5</button>
                        <button class="size-btn" data-size="6">6x6</button>
                        <button class="size-btn" data-size="7">7x7</button>
                        <button class="size-btn" data-size="8">8x8</button>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">特殊功能设置</label>
                    <!-- 功能选项卡 -->
                    <div class="ability-tabs" id="ability-tabs">
                        <button class="ability-tab active" data-ability="undo">撤销</button>
                        <button class="ability-tab" data-ability="smash">敲击</button>
                        <button class="ability-tab" data-ability="swap">交换</button>
                        <button class="ability-tab" data-ability="clear">清除</button>
                        <button class="ability-tab" data-ability="double">翻倍</button>
                    </div>
                    <!-- 撤销面板 -->
                    <div class="ability-panel active" id="panel-undo">
                        <div class="mode-picker undo-mode-picker" id="undo-mode-picker">
                            <button class="mode-btn undo-mode-btn active" data-mode="free">无代价</button>
                            <button class="mode-btn undo-mode-btn" data-mode="cost">扣分模式</button>
                            <button class="mode-btn undo-mode-btn" data-mode="limit">限制次数</button>
                        </div>
                        <div class="mode-settings undo-settings" id="undo-settings">
                            <div class="mode-row undo-setting-row" id="undo-row-multiplier">
                                <span class="mode-label undo-setting-label">基础倍率</span>
                                <input type="number" id="undo-multiplier" min="1" max="200" value="5">
                                <span class="mode-unit undo-setting-unit">x</span>
                            </div>
                            <div class="mode-row undo-setting-row" id="undo-row-increment">
                                <span class="mode-label undo-setting-label">递增幅度</span>
                                <input type="number" id="undo-increment" min="0" max="100" value="50">
                                <span class="mode-unit undo-setting-unit">%</span>
                            </div>
                            <div class="mode-row undo-setting-row" id="undo-row-limit">
                                <span class="mode-label undo-setting-label">使用次数</span>
                                <input type="number" id="undo-limit" min="1" max="20" value="3">
                                <span class="mode-unit undo-setting-unit">次</span>
                            </div>
                        </div>
                    </div>
                    <!-- 敲击面板 -->
                    <div class="ability-panel" id="panel-smash">
                        <div class="mode-picker smash-mode-picker" id="smash-mode-picker">
                            <button class="mode-btn smash-mode-btn active" data-mode="free">无代价</button>
                            <button class="mode-btn smash-mode-btn" data-mode="cost">扣分模式</button>
                            <button class="mode-btn smash-mode-btn" data-mode="limit">限制次数</button>
                        </div>
                        <div class="mode-settings smash-settings" id="smash-settings">
                            <div class="mode-row smash-setting-row" id="smash-row-multiplier">
                                <span class="mode-label smash-setting-label">基础倍率</span>
                                <input type="number" id="smash-multiplier" min="1" max="200" value="5">
                                <span class="mode-unit smash-setting-unit">x</span>
                            </div>
                            <div class="mode-row smash-setting-row" id="smash-row-increment">
                                <span class="mode-label smash-setting-label">递增幅度</span>
                                <input type="number" id="smash-increment" min="0" max="100" value="50">
                                <span class="mode-unit smash-setting-unit">%</span>
                            </div>
                            <div class="mode-row smash-setting-row" id="smash-row-limit">
                                <span class="mode-label smash-setting-label">使用次数</span>
                                <input type="number" id="smash-limit" min="1" max="20" value="3">
                                <span class="mode-unit smash-setting-unit">次</span>
                            </div>
                        </div>
                    </div>
                    <!-- 交换面板 -->
                    <div class="ability-panel" id="panel-swap">
                        <div class="mode-picker swap-mode-picker" id="swap-mode-picker">
                            <button class="mode-btn swap-mode-btn active" data-mode="free">无代价</button>
                            <button class="mode-btn swap-mode-btn" data-mode="cost">扣分模式</button>
                            <button class="mode-btn swap-mode-btn" data-mode="limit">限制次数</button>
                        </div>
                        <div class="mode-settings swap-settings" id="swap-settings">
                            <div class="mode-row swap-setting-row" id="swap-row-multiplier">
                                <span class="mode-label swap-setting-label">基础倍率</span>
                                <input type="number" id="swap-multiplier" min="1" max="200" value="5">
                                <span class="mode-unit swap-setting-unit">x</span>
                            </div>
                            <div class="mode-row swap-setting-row" id="swap-row-increment">
                                <span class="mode-label swap-setting-label">递增幅度</span>
                                <input type="number" id="swap-increment" min="0" max="100" value="50">
                                <span class="mode-unit swap-setting-unit">%</span>
                            </div>
                            <div class="mode-row swap-setting-row" id="swap-row-limit">
                                <span class="mode-label swap-setting-label">使用次数</span>
                                <input type="number" id="swap-limit" min="1" max="20" value="3">
                                <span class="mode-unit swap-setting-unit">次</span>
                            </div>
                        </div>
                    </div>
                    <!-- 清除面板 -->
                    <div class="ability-panel" id="panel-clear">
                        <div class="mode-picker clear-mode-picker" id="clear-mode-picker">
                            <button class="mode-btn clear-mode-btn active" data-mode="free">无代价</button>
                            <button class="mode-btn clear-mode-btn" data-mode="cost">扣分模式</button>
                            <button class="mode-btn clear-mode-btn" data-mode="limit">限制次数</button>
                        </div>
                        <div class="mode-settings clear-settings" id="clear-settings">
                            <div class="mode-row clear-setting-row" id="clear-row-multiplier">
                                <span class="mode-label clear-setting-label">基础倍率</span>
                                <input type="number" id="clear-multiplier" min="1" max="200" value="5">
                                <span class="mode-unit clear-setting-unit">x</span>
                            </div>
                            <div class="mode-row clear-setting-row" id="clear-row-increment">
                                <span class="mode-label clear-setting-label">递增幅度</span>
                                <input type="number" id="clear-increment" min="0" max="100" value="50">
                                <span class="mode-unit clear-setting-unit">%</span>
                            </div>
                            <div class="mode-row clear-setting-row" id="clear-row-limit">
                                <span class="mode-label clear-setting-label">使用次数</span>
                                <input type="number" id="clear-limit" min="1" max="20" value="2">
                                <span class="mode-unit clear-setting-unit">次</span>
                            </div>
                        </div>
                    </div>
                    <!-- 翻倍面板 -->
                    <div class="ability-panel" id="panel-double">
                        <div class="mode-picker double-mode-picker" id="double-mode-picker">
                            <button class="mode-btn double-mode-btn active" data-mode="free">无代价</button>
                            <button class="mode-btn double-mode-btn" data-mode="cost">扣分模式</button>
                            <button class="mode-btn double-mode-btn" data-mode="limit">限制次数</button>
                        </div>
                        <div class="mode-settings double-settings" id="double-settings">
                            <div class="mode-row double-setting-row" id="double-row-multiplier">
                                <span class="mode-label double-setting-label">基础倍率</span>
                                <input type="number" id="double-multiplier" min="1" max="200" value="5">
                                <span class="mode-unit double-setting-unit">x</span>
                            </div>
                            <div class="mode-row double-setting-row" id="double-row-increment">
                                <span class="mode-label double-setting-label">递增幅度</span>
                                <input type="number" id="double-increment" min="0" max="100" value="50">
                                <span class="mode-unit double-setting-unit">%</span>
                            </div>
                            <div class="mode-row double-setting-row" id="double-row-limit">
                                <span class="mode-label double-setting-label">使用次数</span>
                                <input type="number" id="double-limit" min="1" max="20" value="3">
                                <span class="mode-unit double-setting-unit">次</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 排行榜 -->
    <section id="page-leaderboard" class="page">
        <div class="page-card">
            <div class="page-header">
                <button id="btn-back-leaderboard" class="btn-icon" title="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2>排行榜</h2>
            </div>
            <div class="leaderboard-body">
                <div class="filter-tabs" id="filter-tabs">
                    <button class="filter-tab active" data-size="0">全部</button>
                </div>
                <div class="lb-table-wrapper">
                    <table class="lb-table" id="lb-table">
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th class="col-score">分数</th>
                                <th class="col-size">棋盘</th>
                                <th class="col-time">用时</th>
                                <th class="col-date">日期</th>
                            </tr>
                        </thead>
                        <tbody id="lb-body">
                        </tbody>
                    </table>
                    <div class="lb-empty hidden" id="lb-empty">
                        <p>暂无记录</p>
                        <p class="lb-empty-hint">完成一局游戏即可上榜</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/game.js?v=2.1.1"></script>
    <script src="js/storage.js?v=2.1.1"></script>
    <script src="js/app.js?v=2.1.1"></script>
</body>
</html>
